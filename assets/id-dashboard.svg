<text x="72" y="272" font-size="18" fill="#eef7ff" font-weight="630" >• Stronger trust for clients and companies</text>
<text x="72" y="300" font-size="18" fill="#eef7ff" font-weight="630" >• Web, mobile, desktop and automation</text>
