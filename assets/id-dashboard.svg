<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer ID card - Syed Hasnain Raza" width="900" height="500" viewBox="0 0 900 500">
<title>Developer ID card - Syed Hasnain Raza</title>
<desc>Self-contained GitHub profile artwork for Syed Hasnain Raza. Colors: navy, blue, crimson, white. Animation uses CSS and SMIL where supported.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b152b"/><stop offset="1" stop-color="#070b16"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset=".58" stop-color="#8a7eff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14233c" stop-opacity=".85"/><stop offset="1" stop-color="#0d1527" stop-opacity=".94"/></linearGradient>
 <radialGradient id="blueglow"><stop stop-color="#247bff" stop-opacity=".3"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="redglow"><stop stop-color="#ff354f" stop-opacity=".17"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".85" fill="#9cb5ee" opacity=".16"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
 <style>
 :root{color-scheme:dark}
 text{font-family:'Segoe UI',Arial,sans-serif}
 .mono{font-family:Consolas,'Courier New',monospace;letter-spacing:1.4px}
 .muted{fill:#96a8c6}
 .rise{animation:rise .9s both}
 .rise2{animation:rise 1.1s .2s both}
 .rise3{animation:rise 1.1s .45s both}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .float{animation:float 5s ease-in-out infinite}
 @keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
 </style>
</defs>
<rect width="900" height="500" rx="22" fill="url(#base)"/>
<rect width="900" height="500" rx="22" fill="url(#dots)"/>
<rect x=".6" y=".6" width="898.8" height="498.8" rx="21" fill="none" stroke="#4263aa" stroke-opacity=".3"/>
<rect x="30" y="0" width="160" height="3" rx="2" fill="url(#accent)"/>
<text x="49" y="55" fill="#81a9ff" font-size="13" font-weight="730" class="mono" >03  /  DEVELOPER IDENTITY</text><text x="49" y="111" fill="#f5f7ff" font-size="40" font-weight="850" >More than a title.</text><text x="49" y="143" fill="#b6c5de" font-size="16" font-weight="400" >A few things that shape how I work and build.</text><rect x="48" y="172" width="380" height="272" rx="18" fill="url(#panel)" stroke="#345178" stroke-opacity="0.5" /><text x="73" y="208" fill="#8cb4ff" font-size="12" font-weight="750" class="mono" >WORK SNAPSHOT</text><text x="73" y="241" fill="#879fc2" font-size="11" font-weight="700" class="mono" >FOCUS</text><text x="73" y="265" fill="#f5f7ff" font-size="17" font-weight="690" >Full-stack engineering</text><text x="73" y="295" fill="#879fc2" font-size="11" font-weight="700" class="mono" >PRIMARY TOOLS</text><text x="73" y="319" fill="#f5f7ff" font-size="17" font-weight="690" >React · Node.js · MySQL</text><text x="73" y="349" fill="#879fc2" font-size="11" font-weight="700" class="mono" >WORK STYLE</text><text x="73" y="373" fill="#f5f7ff" font-size="17" font-weight="690" >Build · Test · Improve</text><text x="73" y="403" fill="#879fc2" font-size="11" font-weight="700" class="mono" >PUBLIC REPOS</text><text x="73" y="427" fill="#f5f7ff" font-size="17" font-weight="690" >4  •  Checked 11 Oct 2026</text><style>
@keyframes badgein{0%{transform:translateY(-90px) rotate(-20deg)}55%{transform:translateY(0px) rotate(6deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0deg)}}
@keyframes swing{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
#lanyard{transform-origin:669px 62px;animation:badgein 2s cubic-bezier(.2,.75,.2,1) both,swing 6s ease-in-out 2s infinite}
@media(prefers-reduced-motion:reduce){#lanyard{animation:none!important}}
