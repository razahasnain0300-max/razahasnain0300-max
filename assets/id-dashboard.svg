<text x="46" y="108" font-size="41" fill="#f5f8ff" font-weight="850" >Code-built. Client-ready.</text>
<text x="46" y="142" font-size="17" fill="#aec4da" font-weight="500" >An engineering identity for a multi-platform software developer.</text>
