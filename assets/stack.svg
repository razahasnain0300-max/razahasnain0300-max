<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology stack - Node.js React MySQL and more" width="900" height="430" viewBox="0 0 900 430">
<title>Technology stack - Node.js React MySQL and more</title>
<desc>Self-contained GitHub profile artwork for Syed Hasnain Raza. Colors: navy, blue, crimson, white. Animation uses CSS and SMIL where supported.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b152b"/><stop offset="1" stop-color="#070b16"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset=".58" stop-color="#8a7eff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14233c" stop-opacity=".85"/><stop offset="1" stop-color="#0d1527" stop-opacity=".94"/></linearGradient>
 <radialGradient id="blueglow"><stop stop-color="#247bff" stop-opacity=".3"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="redglow"><stop stop-color="#ff354f" stop-opacity=".17"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".85" fill="#9cb5ee" opacity=".16"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
 <style>
 :root{color-scheme:dark}
 text{font-family:'Segoe UI',Arial,sans-serif}
 .mono{font-family:Consolas,'Courier New',monospace;letter-spacing:1.4px}
 .muted{fill:#96a8c6}
 .rise{animation:rise .9s both}
 .rise2{animation:rise 1.1s .2s both}
 .rise3{animation:rise 1.1s .45s both}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .float{animation:float 5s ease-in-out infinite}
 @keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
 </style>
</defs>
<rect width="900" height="430" rx="22" fill="url(#base)"/>
<rect width="900" height="430" rx="22" fill="url(#dots)"/>
<rect x=".6" y=".6" width="898.8" height="428.8" rx="21" fill="none" stroke="#4263aa" stroke-opacity=".3"/>
<rect x="30" y="0" width="160" height="3" rx="2" fill="url(#accent)"/>
<text x="48" y="56" fill="#83aaff" font-size="13" font-weight="750" class="mono" >02  /  THE TOOLBOX</text><text x="48" y="108" fill="#f5f7ff" font-size="40" font-weight="850" >Ideas into systems.</text><text x="48" y="139" fill="#acbfd9" font-size="16" font-weight="400" >A versatile stack for building, shipping and maintaining software.</text><g transform="translate(447 294) rotate(-14)">
<ellipse rx="277" ry="91" fill="none" stroke="#4979c3" stroke-width="1.6" stroke-opacity=".65" stroke-dasharray="5 7"/>
<ellipse rx="208" ry="66" fill="none" stroke="#8c5bac" stroke-width="1.4" stroke-opacity=".8" />
<ellipse rx="138" ry="42" fill="none" stroke="#ff354f" stroke-opacity=".5"/>
</g><circle cx="447" cy="294" r="69" fill="#102447" stroke="#6088d4" stroke-width="1.5"/><text x="447" y="281" fill="#f5f7ff" font-size="23" font-weight="900" text-anchor="middle" >BUILD</text><text x="447" y="307" fill="#aec7ff" font-size="11" font-weight="700" class="mono" text-anchor="middle" >SHIP · SCALE</text><rect x="73" y="194" width="120" height="35" rx="17" fill="#13233e" stroke="#247bff" stroke-opacity=".45"/><text x="133.0" y="217" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >NODE.JS</text><rect x="222" y="183" width="114" height="35" rx="17" fill="#13233e" stroke="#61dafb" stroke-opacity=".45"/><text x="279.0" y="206" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >REACT</text><rect x="575" y="184" width="107" height="35" rx="17" fill="#13233e" stroke="#247bff" stroke-opacity=".45"/><text x="628.5" y="207" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >MYSQL</text><rect x="704" y="216" width="135" height="35" rx="17" fill="#13233e" stroke="#80a7ff" stroke-opacity=".45"/><text x="771.5" y="239" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >TYPESCRIPT</text><rect x="92" y="329" width="105" height="35" rx="17" fill="#13233e" stroke="#ff5e75" stroke-opacity=".45"/><text x="144.5" y="352" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >PYTHON</text><rect x="245" y="360" width="123" height="35" rx="17" fill="#13233e" stroke="#247bff" stroke-opacity=".45"/><text x="306.5" y="383" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >TAILWIND</text><rect x="560" y="358" width="115" height="35" rx="17" fill="#13233e" stroke="#82acff" stroke-opacity=".45"/><text x="617.5" y="381" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >POSTGRES</text><rect x="711" y="335" width="105" height="35" rx="17" fill="#13233e" stroke="#ff526d" stroke-opacity=".45"/><text x="763.5" y="358" fill="#e2ebff" font-size="13" font-weight="650" text-anchor="middle" >GIT / CI</text><text x="48" y="407" fill="#8ea2c3" font-size="12" font-weight="700" class="mono" >FRONTEND   •   BACKEND   •   DATABASES   •   DEPLOYMENT</text></svg>
