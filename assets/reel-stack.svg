<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="268" viewBox="0 0 1120 268" role="img" aria-label="Developer technology stack"><title>Developer technology stack</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a21"/><stop offset=".52" stop-color="#070b20"/><stop offset="1" stop-color="#100a26"/></linearGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49dfff"/><stop offset=".48" stop-color="#755cfc"/><stop offset="1" stop-color="#dd59ed"/></linearGradient><radialGradient id="purple"><stop stop-color="#7731dd" stop-opacity=".24"/><stop offset="1" stop-color="#7731dd" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#8c77c6" opacity=".16"/></pattern><filter id="neonglow"><feGaussianBlur stdDeviation="4"/></filter><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.tiny{font-size:12px}.glow{filter:url(#neonglow)}.scroll{animation:scroll 12s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.shine{animation:shine 5s ease-in-out infinite}@keyframes scroll{0%{transform:translateY(85px)}100%{transform:translateY(-130px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.scroll,.pulse,.shine{animation:none!important}#symbol{display:none!important}#portrait{opacity:1!important}}</style></defs><rect width="1120" height="268" rx="20" fill="url(#bg)"/><rect width="1120" height="268" rx="20" fill="url(#dots)"/><rect x="1" y="1" width="1118" height="266" rx="19" fill="none" stroke="#413675" opacity=".8"/>
