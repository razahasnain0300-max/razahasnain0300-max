<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="313" viewBox="0 0 1120 313" role="img" aria-label="Factual professional portfolio summary cards"><title>Factual professional portfolio summary cards</title>
<defs>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset=".52" stop-color="#0B1020"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset=".52" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#1B2443"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0 H0 V28" fill="none" stroke="#22D3EE" stroke-opacity=".075" stroke-width=".8"/></pattern>
<style>
.mono{font-family:Consolas,'Courier New',monospace!important}.float{animation:floating 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulsing 4s ease-in-out infinite}.blink{animation:blink 1.3s steps(1,end) infinite}
@keyframes floating{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pulsing{0%,100%{opacity:.4}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="1120" height="313" rx="21" fill="url(#dark)"/><rect width="1120" height="313" rx="21" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="311" rx="20" fill="none" stroke="#8B5CF6" stroke-opacity=".49"/>
<rect x="38" width="210" height="3" rx="2" fill="url(#edge)"/>

<text x="45" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#22D3EE" class="mono">PROFILE / PORTFOLIO AT A GLANCE</text>
<text x="45" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="850" fill="#EAF2FF" >Proof is in the projects.</text>
<text x="45" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#94A3B8" >Curated examples, clear capabilities and a simple way to connect.</text>
<g class="float" style="animation-delay:0s"><path d="M53 174 l312 -12 l14 15 l-312 14 Z" fill="#8B5CF6" fill-opacity=".18"/><rect x="48" y="167" width="332" height="125" rx="16" fill="#030511" opacity=".7"/><rect x="43" y="159" width="332" height="125" rx="16" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity=".64"/>
<text x="61" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="860" fill="#8B5CF6" >13</text><text x="61" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" fill="#EAF2FF" class="mono">CURATED PREVIEWS</text><text x="61" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#94A3B8" >Concept designs, labeled</text></g><g class="float" style="animation-delay:0.4s"><path d="M409 174 l312 -12 l14 15 l-312 14 Z" fill="#22D3EE" fill-opacity=".18"/><rect x="404" y="167" width="332" height="125" rx="16" fill="#030511" opacity=".7"/><rect x="399" y="159" width="332" height="125" rx="16" fill="url(#glass)" stroke="#22D3EE" stroke-opacity=".64"/>
<text x="417" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="860" fill="#22D3EE" >6</text><text x="417" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" fill="#EAF2FF" class="mono">SERVICE AREAS</text><text x="417" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#94A3B8" >Client-oriented scope</text></g><g class="float" style="animation-delay:0.8s"><path d="M765 174 l312 -12 l14 15 l-312 14 Z" fill="#8B5CF6" fill-opacity=".18"/><rect x="760" y="167" width="332" height="125" rx="16" fill="#030511" opacity=".7"/><rect x="755" y="159" width="332" height="125" rx="16" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity=".64"/>
<text x="773" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="860" fill="#8B5CF6" >SAFE</text><text x="773" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" fill="#EAF2FF" class="mono">SOURCE PRIVACY</text><text x="773" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#94A3B8" >No newly disclosed private code</text></g>
</svg>