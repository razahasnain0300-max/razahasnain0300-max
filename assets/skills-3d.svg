<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="365" viewBox="0 0 1120 365" role="img" aria-label="Full-stack engineering technology stack"><title>Full-stack engineering technology stack</title><defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08192c"/><stop offset=".55" stop-color="#091321"/><stop offset="1" stop-color="#11152a"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop stop-color="#28d9d1"/><stop offset=".53" stop-color="#73a7ff"/><stop offset="1" stop-color="#c28aff"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#193a53"/><stop offset="1" stop-color="#101c32"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#1b8fd4" stop-opacity=".27"/><stop offset="1" stop-color="#1b8fd4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#6da7d9" stroke-opacity=".11" stroke-width=".7"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:'Consolas','Courier New',monospace}.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.shimmer{animation:shimmer 5s ease-in-out infinite}.up{animation:up .9s both}.del{animation:up 1s .24s both}.spin{animation:rotate 27s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.9}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1120" height="365" rx="22" fill="url(#bg)"/><rect width="1120" height="365" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="363" rx="21" fill="none" stroke="#4f80a6" stroke-opacity=".35"/><rect x="36" y="0" width="205" height="3" rx="2" fill="url(#shine)"/>
<text x="52" y="57" font-size="13" fill="#59e7db" font-weight="750" class="mono">01 / THE ENGINEERING STACK</text>
<text x="52" y="110" font-size="43" fill="#f1f7ff" font-weight="840" >Systems, not just screens.</text>
<text x="52" y="147" font-size="17" fill="#aec4db" font-weight="500" >From intuitive frontend experiences to APIs, data and production infrastructure.</text>
<g class="float" style="animation-delay:0s">
<path d="M72 205 l281 -26 28 25 -279 27 Z" fill="#46ded6" opacity=".21"/>
<path d="M68 221 l293 -26 0 107 -293 22 Z" fill="#102b43" stroke="#46ded6" stroke-opacity=".55"/>
<path d="M361 195 l17 12 0 107 -17 -12 Z" fill="#172544" stroke="#46ded6" stroke-opacity=".43"/>
<text x="89" y="251" font-size="17" fill="#46ded6" font-weight="820" class="mono">FRONTEND</text>
<text x="89" y="281" font-size="14" fill="#d5e2f5" font-weight="570" >React • JavaScript</text><text x="89" y="304" font-size="14" fill="#d5e2f5" font-weight="570" >TypeScript • Tailwind</text><text x="89" y="327" font-size="14" fill="#d5e2f5" font-weight="570" >Responsive UI / UX</text>
</g><g class="float" style="animation-delay:0.55s">
<path d="M426 205 l281 -26 28 25 -279 27 Z" fill="#85a9ff" opacity=".21"/>
<path d="M422 221 l293 -26 0 107 -293 22 Z" fill="#102b43" stroke="#85a9ff" stroke-opacity=".55"/>
<path d="M715 195 l17 12 0 107 -17 -12 Z" fill="#172544" stroke="#85a9ff" stroke-opacity=".43"/>
<text x="443" y="251" font-size="17" fill="#85a9ff" font-weight="820" class="mono">BACKEND</text>
<text x="443" y="281" font-size="14" fill="#d5e2f5" font-weight="570" >Node.js • Express</text><text x="443" y="304" font-size="14" fill="#d5e2f5" font-weight="570" >Python • REST APIs</text><text x="443" y="327" font-size="14" fill="#d5e2f5" font-weight="570" >Auth • Integrations</text>
</g><g class="float" style="animation-delay:1.1s">
<path d="M780 205 l281 -26 28 25 -279 27 Z" fill="#bd9aff" opacity=".21"/>
<path d="M776 221 l293 -26 0 107 -293 22 Z" fill="#102b43" stroke="#bd9aff" stroke-opacity=".55"/>
<path d="M1069 195 l17 12 0 107 -17 -12 Z" fill="#172544" stroke="#bd9aff" stroke-opacity=".43"/>
<text x="797" y="251" font-size="17" fill="#bd9aff" font-weight="820" class="mono">DATA &amp; DELIVERY</text>
<text x="797" y="281" font-size="14" fill="#d5e2f5" font-weight="570" >MySQL • PostgreSQL</text><text x="797" y="304" font-size="14" fill="#d5e2f5" font-weight="570" >Git • CI/CD • VPS</text><text x="797" y="327" font-size="14" fill="#d5e2f5" font-weight="570" >Testing • Monitoring</text>
</g>
</svg>