<rect x="58" y="292" width="460" height="86" rx="18" fill="#11283e" stroke="#5f7ea6" stroke-opacity=".64" /><text x="82" y="323" font-size="15" fill="#96cde4" font-weight="760" class="mono">CORE STACK</text><text x="82" y="352" font-size="16" fill="#ecf7ff" font-weight="640" >Node.js · React · TypeScript · MySQL · Python</text>
