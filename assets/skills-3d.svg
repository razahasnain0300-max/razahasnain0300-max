<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-label="Software services and stack"><title>Software services and stack</title><defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07182a"/><stop offset=".55" stop-color="#0a1221"/><stop offset="1" stop-color="#151629"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop stop-color="#34e0cf"/><stop offset=".52" stop-color="#6cb2ff"/><stop offset="1" stop-color="#d58dff"/></linearGradient>
<linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14324b" stop-opacity=".95"/><stop offset="1" stop-color="#0d152a" stop-opacity=".95"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#1c93d5" stop-opacity=".26"/><stop offset="1" stop-color="#1c93d5" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#7bacda" stroke-opacity=".10" stroke-width=".7"/></pattern>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.float{animation:float 6s ease-in-out infinite;transform-origin:center}.fade{animation:fadeup .9s both}.fade2{animation:fadeup 1s .18s both}.fade3{animation:fadeup 1.1s .35s both}.spin{animation:spin 26s linear infinite;transform-origin:center}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes fadeup{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style>
</defs>
<rect width="1120" height="420" rx="22" fill="url(#bg)"/><rect width="1120" height="420" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="418" rx="21" fill="none" stroke="#4a7ea5" stroke-opacity=".35"/><rect x="36" y="0" width="200" height="3" rx="2" fill="url(#shine)"/>
