<text x="45" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="850" fill="#EAF2FF" >Engineering and delivery, connected.</text>
<text x="45" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="540" fill="#94A3B8" >Category maps are illustrative, not measured skills, ratings or delivery guarantees.</text>
