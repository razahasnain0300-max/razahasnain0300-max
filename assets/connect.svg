<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Connect with Syed Hasnain Raza on GitHub" width="900" height="378" viewBox="0 0 900 378">
<title>Connect with Syed Hasnain Raza on GitHub</title>
<desc>Self-contained GitHub profile artwork for Syed Hasnain Raza. Colors: navy, blue, crimson, white. Animation uses CSS and SMIL where supported.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b152b"/><stop offset="1" stop-color="#070b16"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset=".58" stop-color="#8a7eff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14233c" stop-opacity=".85"/><stop offset="1" stop-color="#0d1527" stop-opacity=".94"/></linearGradient>
 <radialGradient id="blueglow"><stop stop-color="#247bff" stop-opacity=".3"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="redglow"><stop stop-color="#ff354f" stop-opacity=".17"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".85" fill="#9cb5ee" opacity=".16"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
 <style>
 :root{color-scheme:dark}
 text{font-family:'Segoe UI',Arial,sans-serif}
 .mono{font-family:Consolas,'Courier New',monospace;letter-spacing:1.4px}
 .muted{fill:#96a8c6}
 .rise{animation:rise .9s both}
 .rise2{animation:rise 1.1s .2s both}
 .rise3{animation:rise 1.1s .45s both}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .float{animation:float 5s ease-in-out infinite}
 @keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
 </style>
</defs>
<rect width="900" height="378" rx="22" fill="url(#base)"/>
<rect width="900" height="378" rx="22" fill="url(#dots)"/>
<rect x=".6" y=".6" width="898.8" height="376.8" rx="21" fill="none" stroke="#4263aa" stroke-opacity=".3"/>
<rect x="30" y="0" width="160" height="3" rx="2" fill="url(#accent)"/>
<ellipse cx="190" cy="235" rx="220" ry="160" fill="url(#blueglow)"/><text x="49" y="60" fill="#8db4ff" font-size="13" font-weight="750" class="mono" >04  /  LET’S CONNECT</text><text x="49" y="106" fill="#f5f7ff" font-size="38" font-weight="850" >Build something meaningful.</text><text x="49" y="135" fill="#b3c4dd" font-size="16" font-weight="400" >Projects, ideas, and engineering conversations.</text><circle cx="211" cy="252" r="112" fill="#142a4b" stroke="#476bad" stroke-width="2"/><circle cx="211" cy="252" r="88" fill="#1a355b" stroke="#f65471" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 11"/><text x="210" y="270" fill="url(#accent)" font-size="71" font-weight="900" text-anchor="middle" >SH</text><path d="M310 242 L375 242 M362 228 L376 242 L362 256" stroke="#65a8ff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="211" y="362" fill="#bacce7" font-size="11" font-weight="750" class="mono" text-anchor="middle" >SYED HASNAIN</text><rect x="437" y="163" width="411" height="56" rx="12" fill="url(#panel)" stroke="#3b5789" stroke-opacity="0.5" /><circle cx="469" cy="191" r="19" fill="#1d3c66" stroke="#648cff" stroke-opacity=".45"/><text x="469" y="196" fill="#dbe8ff" font-size="13" font-weight="700" text-anchor="middle" >GH</text><text x="503" y="185" fill="#f5f7ff" font-size="15" font-weight="800" class="mono" >GITHUB</text><text x="503" y="205" fill="#a6bad7" font-size="12" font-weight="500" >Browse repositories</text><text x="815" y="199" fill="#8db7ff" font-size="25" font-weight="700" text-anchor="middle" >↗</text><rect x="437" y="229" width="411" height="56" rx="12" fill="url(#panel)" stroke="#3b5789" stroke-opacity="0.5" /><circle cx="469" cy="257" r="19" fill="#1d3c66" stroke="#648cff" stroke-opacity=".45"/><text x="469" y="262" fill="#dbe8ff" font-size="13" font-weight="700" text-anchor="middle" >PR</text><text x="503" y="251" fill="#f5f7ff" font-size="15" font-weight="800" class="mono" >PROJECTS</text><text x="503" y="271" fill="#a6bad7" font-size="12" font-weight="500" >Explore my public work</text><text x="815" y="265" fill="#8db7ff" font-size="25" font-weight="700" text-anchor="middle" >↗</text><rect x="437" y="295" width="411" height="56" rx="12" fill="url(#panel)" stroke="#3b5789" stroke-opacity="0.5" /><circle cx="469" cy="323" r="19" fill="#1d3c66" stroke="#648cff" stroke-opacity=".45"/><text x="469" y="328" fill="#dbe8ff" font-size="13" font-weight="700" text-anchor="middle" >AC</text><text x="503" y="317" fill="#f5f7ff" font-size="15" font-weight="800" class="mono" >ACTIVITY</text><text x="503" y="337" fill="#a6bad7" font-size="12" font-weight="500" >See my contributions</text><text x="815" y="331" fill="#8db7ff" font-size="25" font-weight="700" text-anchor="middle" >↗</text></svg>
