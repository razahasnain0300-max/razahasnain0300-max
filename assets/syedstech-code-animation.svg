<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">SyedsTech animated developer terminal</title><desc id="desc">Neon green SyedsTech logo and animated code typing on a dark terminal</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#B5FF16"/><stop offset="1" stop-color="#00C66A"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2C5C37" opacity=".22"/></pattern><clipPath id="type1"><rect x="435" y="137" width="0" height="28"><animate attributeName="width" values="0;630;630;0" keyTimes="0;.36;.85;1" dur="9s" repeatCount="indefinite"/></clipPath><clipPath id="type2"><rect x="435" y="178" width="0" height="28"><animate attributeName="width" values="0;0;640;640;0" keyTimes="0;.25;.65;.9;1" dur="9s" repeatCount="indefinite"/></clipPath></defs><rect width="1200" height="360" rx="20" fill="#06110B"/><rect width="1200" height="360" rx="20" fill="url(#grid)"/><rect x="22" y="20" width="1156" height="320" rx="14" fill="#081810" stroke="#275C34"/><rect x="22" y="20" width="1156" height="44" rx="14" fill="#11251A"/><circle cx="49" cy="42" r="6" fill="#ff6b6b"/><circle cx="70" cy="42" r="6" fill="#ffce55"/><circle cx="91" cy="42" r="6" fill="#63d98a"/><text x="130" y="48" font-family="monospace" font-size="16" fill="#A6C8AC">syedstech — portfolio-terminal</text><path d="M245 105L148 163L246 217L149 271L247 323" fill="none" stroke="url(#g)" stroke-width="25" stroke-linejoin="round" stroke-linecap="round"><animate attributeName="stroke-opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/></path><text x="420" y="108" font-family="monospace" font-size="25" font-weight="bold" fill="#A9FF27">$ syedstech --build</text><g clip-path="url(#type1)"><text x="435" y="159" font-family="monospace" font-size="22" fill="#F0FFF2">const engineer = "Full-Stack Software Engineer";</text></g><g clip-path="url(#type2)"><text x="435" y="200" font-family="monospace" font-size="22" fill="#B5FF16">build({ webApps: true, aiAutomation: true });</text></g><text x="435" y="255" font-family="monospace" font-size="20" fill="#8CB69B">[ OK ] Scalable applications. Real business value.</text><rect x="435" y="277" width="12" height="24" fill="#9DFF2B"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><path d="M0 345Q250 315 450 344T900 337T1200 341" fill="none" stroke="url(#g)" stroke-width="3"/></svg>