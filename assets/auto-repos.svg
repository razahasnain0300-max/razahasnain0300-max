<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="296" viewBox="0 0 1120 296" role="img" aria-label="Automatically synchronized public project cards"><title>Public repository radar</title><defs><linearGradient id="b"><stop stop-color="#070B14"/><stop offset="1" stop-color="#0B1020"/></linearGradient></defs><rect width="1120" height="296" rx="20" fill="url(#b)"/><rect x="1" y="1" width="1118" height="294" rx="19" fill="none" stroke="#8B5CF6" stroke-opacity=".65"/><text x="45" y="53" fill="#22D3EE" font-size="14" font-family="Arial">PUBLIC REPOSITORY RADAR  /  AUTO SYNC</text><text x="45" y="113" fill="#EAF2FF" font-size="34" font-family="Arial" font-weight="bold">New projects, automatically featured.</text><text x="45" y="159" fill="#94A3B8" font-size="18" font-family="Arial">New public repositories will appear after the next GitHub Actions run.</text><rect x="45" y="199" width="828" height="49" rx="12" fill="#101A2E" stroke="#22D3EE" stroke-opacity=".56"/><text x="67" y="230" fill="#C4B5FD" font-family="Arial" font-size="17">Private work remains excluded until you approve public disclosure.</text></svg>
