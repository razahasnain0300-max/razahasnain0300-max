name: Auto-update premium project cards
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_projects.py"
      - ".github/workflows/auto-project-cards.yml"
permissions:
  contents: write
concurrency:
  group: portfolio-project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate premium public project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_projects.py
      - name: Commit changes when projects change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/auto-projects
          if ! git diff --cached --quiet; then
            git commit -m "chore: automatically refresh premium project cards"
            git push
          fi
