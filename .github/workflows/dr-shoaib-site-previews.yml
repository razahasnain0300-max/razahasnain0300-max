name: Capture Dr Shoaib public website pages

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 0'
  push:
    paths:
      - '.github/workflows/dr-shoaib-site-previews.yml'
      - 'scripts/capture_dr_shoaib.py'

permissions:
  contents: write

concurrency:
  group: dr-shoaib-page-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium capture dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture public pages
        run: python scripts/capture_dr_shoaib.py
      - name: Refresh profile project cards
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest discover -s tests -p 'test_project_gallery.py' -v
          python scripts/build_project_gallery.py
      - name: Commit screenshots and images-only gallery
        shell: bash
        run: |
          git add README.md PORTFOLIO.md portfolio/curated_projects.json assets/previews/dr-shoaib-*.png
          if git diff --cached --quiet; then
            echo "No preview updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(profile): refresh real Dr Shoaib website previews [skip ci]"
          git push
