name: Build animated portrait GIF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/animated-portrait.yml'
      - 'scripts/build_portrait.py'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/build_portrait.py
      - name: Publish animated portrait
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hasnain-coding-animation.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Render animated developer portrait'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
