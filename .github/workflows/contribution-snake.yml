name: Purple Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3,15 * * *'
  push:
    paths:
      - '.github/workflows/contribution-snake.yml'
      - 'interactive-snake/index.html'

permissions:
  contents: write

concurrency:
  group: purple-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Generate purple contribution snakes from real GitHub activity
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: razahasnain0300-max
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-purple-dark.svg?color_snake=#C4B5FD&color_dots=#0B1020,#292344,#4C1D95,#7C3AED,#A78BFA
            dist/snake-purple-light.svg?color_snake=#7C3AED&color_dots=#F8F7FF,#EDE9FE,#DDD6FE,#A78BFA,#7C3AED
      - name: Validate snake output and include interactive demo
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('dist/snake-purple-dark.svg')
          ET.parse('dist/snake-purple-light.svg')
          print('Both animated snake files are valid SVG')
          PY
          cp interactive-snake/index.html dist/index.html
          test -s dist/index.html
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
