name: Capture Hadia Collection real website previews

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 0'
  push:
    paths:
      - '.github/workflows/hadia-site-previews.yml'
      - 'scripts/capture_hadia.py'

permissions:
  contents: write

concurrency:
  group: hadia-storefront-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install approved browser screenshot dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture only approved anonymous public Hadia Collection pages
        run: python scripts/capture_hadia.py
      - name: Validate and update dynamic gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest discover -s tests -p 'test_project_gallery.py' -v
          python scripts/build_project_gallery.py
      - name: Commit live screenshot previews
        shell: bash
        run: |
          git add README.md PORTFOLIO.md portfolio/curated_projects.json assets/previews/hadia-*.webp
          if git diff --cached --quiet; then
            echo "No public screenshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(profile): refresh real Hadia Collection website previews [skip ci]"
          git push
